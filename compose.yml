# Single deployment method for Rilo — same file for local Docker runs and the VPS.
#   local:  docker compose up            (app + searxng, http://localhost:8080)
#   deploy: git pull && docker compose up -d --build
# Native no-Docker dev still works via `npm run dev` (see deploy/README.md).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env                 # secrets + per-machine values (gitignored; see .env.example)
    environment:                   # invariant, non-secret — identical everywhere, and these
      SEARXNG_URL: http://searxng:8080 # win over .env so they can't be broken from there
      WEB_PORT: "8080"             # container always listens on 8080
      DB_PATH: /app/data/agent.db  # points at the bind-mounted data dir below
    ports:
      - "${HOST_PORT:-8080}:8080"  # change the host side via HOST_PORT, not WEB_PORT
    volumes:
      - ./data:/app/data           # bind-mount: reuses an existing agent.db, host-visible
    depends_on:
      - searxng
    restart: unless-stopped

  # Bundled web-search backend: no API key, no signup, no per-query cost.
  # Internal-only (no host publish) — the app reaches it at http://searxng:8080,
  # so it never touches the host firewall.
  searxng:
    image: searxng/searxng:latest # pin a tag before a public release
    volumes:
      - ./searxng:/etc/searxng     # settings.yml enables the JSON format Rilo needs
                                    # (not :ro — the entrypoint may write a secret on boot)
    restart: unless-stopped
