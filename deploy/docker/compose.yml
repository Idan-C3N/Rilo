services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file: ../../.env          # secrets: ENC_KEY, TELEGRAM_TOKEN, OPENROUTER_KEY, etc.
    environment:
      DB_PATH: /app/data/agent.db # override .env — must point at the volume
      WEB_PORT: "8080"            # container always listens on 8080
      SEARXNG_URL: http://searxng:8080 # bundled default web-search backend (below)
    ports:
      - "${HOST_PORT:-8080}:8080" # change the host side via HOST_PORT, not WEB_PORT
    volumes:
      - agent-data:/app/data      # SQLite persistence across restarts
    depends_on:
      - searxng
    restart: unless-stopped

  # Bundled web-search backend: no API key, no signup, no per-query cost.
  # Internal-only (no host publish) — the app reaches it at http://searxng:8080.
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng   # settings.yml enables the JSON format Rilo needs
                                 # (not :ro — the entrypoint may write a secret on boot)
    restart: unless-stopped

volumes:
  agent-data:
